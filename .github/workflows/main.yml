
name: Run Actions Automation

on:
  schedule:
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '30 12 * * *'   # 6:00 PM IST

  workflow_dispatch:

concurrency:
  group: actions-automation
  cancel-in-progress: false

jobs:
  run-actions:
    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Execute Actions.py
      - name: Execute Actions.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="

          echo "Python version:"
          python --version

          echo "🚀 Starting Actions.py..."

          python -u Actions.py

          echo "✅ Actions.py executed successfully."
